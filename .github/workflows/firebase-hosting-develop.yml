name: Deploy to Firebase Hosting (develop / pruebas)

# Se dispara con cada push a develop — publica en un canal de vista previa
# fijo (no en el sitio de producción), con su propia URL para probar antes
# de mandar los cambios a main. Cada push renueva los 30 días de vigencia,
# así que mientras sigas trabajando en develop el canal nunca expira.
on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_ENV: development

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: mavikekas-690e0
          channelId: develop
          expires: 30d
